[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindbridge-rag"
version = "0.1.0"
description = "Retrieval-grounded support assistant with a crisis-safety layer, hybrid search and an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hitesh Kavati" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mindbridge = "mindbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# regex tables read better on one line each than wrapped
"src/mindbridge/safety.py" = ["E501"]
